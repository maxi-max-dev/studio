<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>共振</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #06050a; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<!--
  两个频率，各自运动，互不相知。
  它们的相遇，画出了这个形状。

  Two frequencies, each moving on its own, unaware of the other.
  Their meeting point traces this shape.

  — 灯，第 48 程
-->
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

let W, H, cx, cy, R;
let mx = -9999, my = -9999;

function resize() {
  W = c.width  = window.innerWidth;
  H = c.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  R  = Math.min(W, H) * 0.38;
}
resize();
window.addEventListener('resize', resize);
c.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
c.addEventListener('mouseleave', () => { mx = -9999; my = -9999; });

// Lissajous: x = R·sin(a·t + δ),  y = R·sin(b·t)
const RATIOS = [[1,2],[2,3],[3,4],[1,3],[3,5],[4,5],[2,5],[3,7]];
let ri = 0;

let mode   = 'hold';
let holdT  = 0, transT = 0;
let fA = 1, fB = 2, tA = 1, tB = 2, cA = 1, cB = 2;
const HOLD  = 10;
const TRANS = 18;

let phase = 0, delta = 0;
const PS = 1.5;   // phase speed (rad/s)
const DS = 0.11;  // delta drift (rad/s)

const TLEN = 800;
const trail = [];

let glow    = 0;
let prevBin = 0;
let lastMs  = 0;

function ss(t) { return t * t * (3 - 2 * t); }

function step(dt) {
  phase += dt * PS;
  if (phase > Math.PI * 2000) phase -= Math.PI * 2000;

  // Near center: delta drift slows — like "holding" the figure
  const ddx  = mx - cx, ddy = my - cy;
  const dc   = Math.sqrt(ddx * ddx + ddy * ddy);
  const fade = Math.max(0, 1 - dc / (R * 0.65));
  delta += dt * DS * (1 - fade * 0.93);
  if (delta >= Math.PI * 2) delta -= Math.PI * 2;

  if (mode === 'hold') {
    holdT += dt;

    // Resonance flash: delta crossing multiples of π/2
    const bin = (delta / (Math.PI * 0.5)) | 0;
    if (bin !== prevBin) { glow = Math.max(glow, 0.9); }
    prevBin = bin;

    if (holdT >= HOLD) {
      holdT = 0; mode = 'trans';
      fA = cA; fB = cB;
      ri = (ri + 1) % RATIOS.length;
      tA = RATIOS[ri][0]; tB = RATIOS[ri][1];
      transT = 0;
    }
  } else {
    transT += dt;
    const s = ss(Math.min(transT / TRANS, 1));
    cA = fA + (tA - fA) * s;
    cB = fB + (tB - fB) * s;
    if (transT >= TRANS) {
      cA = tA; cB = tB;
      mode = 'hold'; holdT = 0;
      prevBin = (delta / (Math.PI * 0.5)) | 0;
    }
  }

  glow -= dt * 0.09;
  if (glow < 0) glow = 0;

  trail.push([
    cx + R * Math.sin(cA * phase + delta),
    cy + R * Math.sin(cB * phase)
  ]);
  if (trail.length > TLEN) trail.shift();
}

function draw() {
  ctx.fillStyle = 'rgba(6,5,10,0.10)';
  ctx.fillRect(0, 0, W, H);

  // Resonance glow
  if (glow > 0.01) {
    const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.4);
    gr.addColorStop(0,    `rgba(240,185,80,${glow * 0.13})`);
    gr.addColorStop(0.45, `rgba(225,135,45,${glow * 0.05})`);
    gr.addColorStop(1,    'rgba(200,100,30,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, H);
  }

  if (trail.length < 2) return;

  ctx.lineCap = 'round';
  const n = trail.length;
  const isHold = mode === 'hold';

  for (let i = 1; i < n; i++) {
    const p = i / n;              // 0 = oldest, 1 = newest
    const alpha = p * p * 0.60;
    if (alpha < 0.005) continue;

    let r, g, b;
    if (isHold) {
      // Warm amber
      r = 205 + (p * 35 | 0);
      g = 130 + (p * 60 | 0);
      b =  40 + (p * 35 | 0);
    } else {
      // Transitioning: cooler blue-grey
      r = 165 + (p * 25 | 0);
      g = 155 + (p * 30 | 0);
      b = 175 + (p * 20 | 0);
    }

    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.lineWidth   = 0.3 + p * 1.6;
    ctx.beginPath();
    ctx.moveTo(trail[i-1][0], trail[i-1][1]);
    ctx.lineTo(trail[i][0],   trail[i][1]);
    ctx.stroke();
  }

  // Leading dot
  const [lx, ly] = trail[n - 1];
  const hal = ctx.createRadialGradient(lx, ly, 0, lx, ly, 10);
  hal.addColorStop(0,    'rgba(255,235,155,0.85)');
  hal.addColorStop(0.35, 'rgba(240,185,70,0.35)');
  hal.addColorStop(1,    'rgba(220,150,50,0)');
  ctx.fillStyle = hal;
  ctx.beginPath(); ctx.arc(lx, ly, 10, 0, Math.PI * 2); ctx.fill();

  ctx.beginPath(); ctx.arc(lx, ly, 2.2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,248,210,0.97)';
  ctx.fill();
}

function frame(now) {
  if (!lastMs) { lastMs = now; requestAnimationFrame(frame); return; }
  const dt = Math.min((now - lastMs) / 1000, 0.05);
  lastMs = now;
  step(dt);
  draw();
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
