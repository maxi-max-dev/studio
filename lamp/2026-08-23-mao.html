<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>锚</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #070707; overflow: hidden; }
canvas { display: block; }
#hint {
  position: fixed;
  bottom: 38px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.16);
  font-family: 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  font-size: 12px;
  letter-spacing: 0.22em;
  pointer-events: none;
  transition: opacity 1.8s;
}
#title {
  position: fixed;
  top: 28px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.055);
  font-family: 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  font-size: 11px;
  letter-spacing: 0.45em;
  pointer-events: none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">触碰，开始</div>
<div id="title">锚</div>
<script>
const canvas = document.getElementById('c');
const g = canvas.getContext('2d');
const hint = document.getElementById('hint');

let audioCtx = null;
let running = false;
let lineVis = 0;
let breathPhase = Math.random() * Math.PI * 2;
let particles = [];
let LINE_Y, LINE_X1, LINE_X2;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  LINE_Y = canvas.height * 0.63;
  const m = canvas.width * 0.21;
  LINE_X1 = m;
  LINE_X2 = canvas.width - m;
}
resize();
window.addEventListener('resize', resize);

// Drone: A2 = 110 Hz. Melody: A minor pentatonic ish, up one-two octaves.
const DRONE_FREQ = 110;
const NOTES = [220, 261.63, 293.66, 329.63, 392, 440];

function noteToY(freq) {
  const semi = 12 * Math.log2(freq / DRONE_FREQ);
  return LINE_Y - semi * 10;
}

function noteToX(freq) {
  // low notes drift slightly left, high right — plus randomness
  const t = Math.log2(freq / 220) / 1.0; // 0 at 220, 1 at 440
  const cx = canvas.width / 2;
  return cx + (t - 0.5) * canvas.width * 0.23 + (Math.random() - 0.5) * 70;
}

function addParticle(freq, duration) {
  particles.push({
    x: noteToX(freq),
    y: noteToY(freq),
    r: 2.8 + ((freq - 220) / 220) * 3.2,
    op: 0,
    phase: 'in',
    pt: 0,
    inD: 0.17,
    holdD: Math.max(duration - 0.62, 0.35),
    outD: 0.50,
  });
}

function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();

  // Anchor drone — always present
  const droneOsc = audioCtx.createOscillator();
  const droneGain = audioCtx.createGain();
  droneOsc.type = 'sine';
  droneOsc.frequency.value = DRONE_FREQ;
  droneGain.gain.setValueAtTime(0, audioCtx.currentTime);
  droneGain.gain.linearRampToValueAtTime(0.030, audioCtx.currentTime + 4.0);
  droneOsc.connect(droneGain);
  droneGain.connect(audioCtx.destination);
  droneOsc.start();

  running = true;
  setTimeout(schedulePhrase, (Math.random() * 3 + 3.5) * 1000);
}

function playNote(freq, startAt, duration) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'sine';
  osc.frequency.value = freq;

  // subtle stereo pan
  let chain = gain;
  try {
    const panner = audioCtx.createStereoPanner();
    const pan = ((freq - 330) / 220) * 0.32;
    panner.pan.value = Math.max(-0.4, Math.min(0.4, pan));
    gain.connect(panner);
    panner.connect(audioCtx.destination);
  } catch (_) {
    gain.connect(audioCtx.destination);
  }

  gain.gain.setValueAtTime(0, startAt);
  gain.gain.linearRampToValueAtTime(0.092, startAt + 0.14);
  gain.gain.setValueAtTime(0.092, startAt + duration - 0.52);
  gain.gain.linearRampToValueAtTime(0, startAt + duration);

  osc.connect(gain);
  osc.start(startAt);
  osc.stop(startAt + duration + 0.06);

  const d = Math.max(0, (startAt - audioCtx.currentTime) * 1000);
  setTimeout(() => { if (running) addParticle(freq, duration); }, d);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function schedulePhrase() {
  if (!running) return;
  const now = audioCtx.currentTime;
  const startIn = Math.random() * 6 + 4;
  const at = now + startIn;

  // 1, 2, 2, or 3 notes — mostly 2
  const count = [1, 2, 2, 3][Math.floor(Math.random() * 4)];
  const picked = shuffle(NOTES).slice(0, count);

  let t = at;
  for (const freq of picked) {
    const dur = Math.random() * 1.5 + 1.0;
    playNote(freq, t, dur);
    t += dur * 0.6 + Math.random() * 0.4;
  }

  const nextIn = (t - now) + Math.random() * 8 + 5;
  setTimeout(schedulePhrase, nextIn * 1000);
}

// Animation
let last = null;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
  last = ts;

  g.fillStyle = '#070707';
  g.fillRect(0, 0, canvas.width, canvas.height);

  if (!running) return;

  // Line fades in slowly, then breathes
  if (lineVis < 0.33) lineVis = Math.min(0.33, lineVis + dt * 0.08);
  breathPhase += dt * 0.085;
  const op = lineVis + Math.sin(breathPhase * Math.PI * 2) * 0.052;

  g.save();
  g.globalAlpha = op;
  g.strokeStyle = '#ffffff';
  g.lineWidth = 0.55;
  g.beginPath();
  g.moveTo(LINE_X1, LINE_Y);
  g.lineTo(LINE_X2, LINE_Y);
  g.stroke();
  g.restore();

  // Particles
  particles = particles.filter(p => {
    p.pt += dt;
    if (p.phase === 'in') {
      p.op = Math.min(1, p.pt / p.inD);
      if (p.pt >= p.inD) { p.phase = 'hold'; p.pt = 0; }
    } else if (p.phase === 'hold') {
      p.op = 1;
      if (p.pt >= p.holdD) { p.phase = 'out'; p.pt = 0; }
    } else {
      p.op = Math.max(0, 1 - p.pt / p.outD);
      if (p.op <= 0) return false;
    }

    g.save();
    g.globalAlpha = p.op * 0.70;
    g.fillStyle = '#ffffff';
    g.beginPath();
    g.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    g.fill();
    // soft glow
    g.globalAlpha = p.op * 0.11;
    g.beginPath();
    g.arc(p.x, p.y, p.r * 3.0, 0, Math.PI * 2);
    g.fill();
    g.restore();
    return true;
  });
}
requestAnimationFrame(frame);

function start() {
  if (!running) {
    initAudio();
    hint.style.opacity = '0';
    setTimeout(() => hint.remove(), 1800);
  }
}
document.addEventListener('click', start);
document.addEventListener('touchstart', start, { passive: true });
</script>
</body>
</html>
