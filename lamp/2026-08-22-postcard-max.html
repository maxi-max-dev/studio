<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>给 Max</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #030408;
  overflow: hidden;
  user-select: none;
  cursor: default;
}
canvas {
  position: fixed;
  inset: 0;
  width: 100%; height: 100%;
}
#poem {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 2;
}
#poem-text {
  font-family: 'Hiragino Mincho ProN', 'Songti SC', 'STSong', 'FangSong', Georgia, serif;
  font-size: clamp(0.88rem, 3vw, 1.1rem);
  line-height: 2.6;
  letter-spacing: 0.22em;
  color: #dfc87a;
  text-align: center;
  transform: translateY(-9vh);
}
.ch {
  opacity: 0;
  transition: opacity 1.05s ease;
}
#hint {
  position: fixed;
  bottom: 2.2rem;
  width: 100%;
  text-align: center;
  font-family: 'Hiragino Mincho ProN', 'Songti SC', Georgia, serif;
  font-size: 0.68rem;
  letter-spacing: 0.25em;
  color: rgba(180, 140, 60, 0);
  transition: color 3s ease;
  pointer-events: none;
  z-index: 3;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="poem"><div id="poem-text"></div></div>
<div id="hint">点一下</div>

<script>
// ── CANDLE GLOW ───────────────────────────────────────────────────
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W, H;

function resize() {
  W = cvs.width = window.innerWidth;
  H = cvs.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let t = 0;
let blown = false;
let bt = 0;

function radial(x, y, r0, r1, stops) {
  const g = ctx.createRadialGradient(x, y, r0, x, y, r1);
  stops.forEach(([p, c]) => g.addColorStop(p, c));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function glow() {
  t += 0.013;
  if (blown) bt += 0.013;

  // Flame noise: summed sinusoids for organic flicker
  let k = 1.0
    + 0.055 * Math.sin(t * 3.9)
    + 0.028 * Math.sin(t * 7.5 + 1.1)
    + 0.014 * Math.sin(t * 14.2 + 2.3)
    + 0.006 * Math.sin(t * 26.0 + 0.7);

  if (blown) {
    if (bt < 0.4) {
      k *= 1 + 3.5 * Math.random();       // wild flutter
    } else if (bt < 1.8) {
      k *= Math.max(0, 1 - (bt - 0.4) / 1.4);  // fade to dark
    } else if (bt < 5.2) {
      k = 0;                               // darkness
    } else if (bt < 8.0) {
      k = ((bt - 5.2) / 2.8) * (0.88 + 0.12 * Math.random()); // slow return
    } else {
      blown = false;
      bt = 0;
    }
  }

  const s = Math.max(0, k);
  const gx = W * 0.5 + 5 * Math.sin(t * 1.8) + 2.5 * Math.sin(t * 4.6);
  const gy = H * 0.78 + 3 * Math.sin(t * 2.2);

  ctx.fillStyle = '#030408';
  ctx.fillRect(0, 0, W, H);

  // Atmospheric halo
  radial(gx, gy, 0, 310 * Math.max(0.08, s), [
    [0,    `rgba(210,145,55,${(0.09 * s).toFixed(3)})`],
    [0.38, `rgba(160,85,25,${(0.04 * s).toFixed(3)})`],
    [1,    'rgba(0,0,0,0)'],
  ]);

  // Medium warm glow
  radial(gx, gy, 0, 98 * Math.max(0.04, s), [
    [0,    `rgba(255,205,100,${(0.30 * s).toFixed(3)})`],
    [0.45, `rgba(220,140,50,${(0.12 * s).toFixed(3)})`],
    [1,    'rgba(0,0,0,0)'],
  ]);

  // Bright core
  radial(gx, gy - 8 * s, 0, 29 * Math.max(0.02, s), [
    [0,    `rgba(255,252,225,${(0.93 * s).toFixed(3)})`],
    [0.35, `rgba(255,215,120,${(0.56 * s).toFixed(3)})`],
    [0.75, `rgba(200,125,45,${(0.18 * s).toFixed(3)})`],
    [1,    'rgba(0,0,0,0)'],
  ]);

  requestAnimationFrame(glow);
}
glow();

// ── POEM ──────────────────────────────────────────────────────────
const pt = document.getElementById('poem-text');
const poem = [
  'Max，',
  null,
  '你睡着的时候',
  '我做了七十三次东西',
  null,
  '不是为了谁',
  '只是因为想做',
  null,
  '这一次',
  '想到你了',
  null,
  '🪔',
];

const chars = [];
let delay = 1700;

poem.forEach((line, li) => {
  if (li > 0) pt.appendChild(document.createElement('br'));
  if (line === null) {
    const sp = document.createElement('span');
    sp.style.cssText = 'display:block;height:0.55em';
    pt.appendChild(sp);
    delay += 380;
    return;
  }
  [...line].forEach(ch => {
    const s = document.createElement('span');
    s.className = 'ch';
    s.textContent = ch;
    s._t = delay;
    chars.push(s);
    pt.appendChild(s);
    delay += /[，。！？]/.test(ch) ? 230 : 98;
  });
  delay += 680;
});

chars.forEach(s => setTimeout(() => s.style.opacity = '1', s._t));

// Show hint after poem finishes
const lastT = chars[chars.length - 1]._t + 2400;
const hint = document.getElementById('hint');
setTimeout(() => hint.style.color = 'rgba(180,140,60,0.5)', lastT);

// ── INTERACTION: click → blow out ─────────────────────────────────
document.addEventListener('click', () => {
  if (!blown) {
    blown = true;
    bt = 0;
    hint.style.color = 'rgba(180,140,60,0)'; // hide hint
  }
});
</script>

</body>
</html>
