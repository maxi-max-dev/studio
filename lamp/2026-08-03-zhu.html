<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>烛</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #0d0905; overflow: hidden; width: 100vw; height: 100vh; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
});

let mx = W / 2, my = -9999;
let lastMove = Date.now();
canvas.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY; lastMove = Date.now();
});

function wave(t, ...specs) {
  return specs.reduce((s, [f, a, p]) => s + Math.sin(t * f + (p || 0)) * a, 0);
}

function flamePath(ctx, tx, bx, by, w, h) {
  ctx.beginPath();
  ctx.moveTo(bx, by);
  ctx.bezierCurveTo(bx - w, by - h * 0.15, tx - w * 0.4, by - h * 0.9, tx, by - h);
  ctx.bezierCurveTo(tx + w * 0.4, by - h * 0.9, bx + w, by - h * 0.15, bx, by);
}

function draw(t) {
  ctx.clearRect(0, 0, W, H);

  const cx = W / 2;
  const cw = 20;
  const ch = Math.min(H * 0.22, 130);
  const cbot = H * 0.62;
  const ctop = cbot - ch;
  const wy = ctop - 13;

  const still = (Date.now() - lastMove) / 1000;
  const sg = Math.min(1, Math.max(0, (still - 38) / 10));
  const sp = sg > 0.8 ? Math.sin(t * 0.35) * (sg - 0.8) * 1.0 : 0;

  const fdx = mx - cx, fdy = my - wy;
  const fdist = Math.sqrt(fdx * fdx + fdy * fdy);
  const prox = Math.max(0, 1 - fdist / 200);
  const mangle = Math.atan2(fdy, fdx);

  const organic = wave(t, [1.1, 3.5, 0], [2.6, 2.0, 1.4], [0.45, 2.8, 2.1]);
  const mblow = prox > 0 ? -Math.cos(mangle) * prox * 12 : 0;
  const sway = (organic + mblow) * (1 - sg * 0.92);

  const fh = 58 + wave(t, [0.85, 7, 0], [2.2, 3.5, 1.8]) * (1 - sg * 0.6) + sg * 14 + sp * 6;
  const fw = 23 + wave(t, [1.4, 3, 0.9]) * (1 - sg * 0.6);

  const tx = cx + sway;
  const bx = cx + sway * 0.12;
  const by = wy;

  // Ambient light
  let ar = 300 + sg * 120 + sp * 40;
  let aa = 0.11 + sg * 0.09 + sp * 0.03;
  let g = ctx.createRadialGradient(cx, wy - 18, 0, cx, wy - 18, ar);
  g.addColorStop(0, `rgba(255,178,72,${aa})`);
  g.addColorStop(0.45, `rgba(255,118,32,${aa * 0.36})`);
  g.addColorStop(1, 'rgba(255,65,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Surface pool
  let pa = 0.20 + sg * 0.14 + sp * 0.05;
  g = ctx.createRadialGradient(cx, cbot + 18, 0, cx, cbot + 18, 145);
  g.addColorStop(0, `rgba(255,205,108,${pa})`);
  g.addColorStop(0.42, `rgba(255,152,52,${pa * 0.36})`);
  g.addColorStop(1, 'rgba(255,88,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Candle body
  g = ctx.createLinearGradient(cx - cw / 2, 0, cx + cw / 2, 0);
  g.addColorStop(0, '#7a5630');
  g.addColorStop(0.22, '#c8a87e');
  g.addColorStop(0.52, '#d4b896');
  g.addColorStop(0.82, '#b08855');
  g.addColorStop(1, '#6e4820');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.rect(cx - cw / 2, ctop, cw, ch); ctx.fill();

  // Candle top glow
  let tla = 0.28 + sg * 0.18 + sp * 0.08;
  g = ctx.createRadialGradient(cx, ctop, 0, cx, ctop, cw);
  g.addColorStop(0, `rgba(255,225,142,${tla})`);
  g.addColorStop(1, 'rgba(210,148,68,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(cx, ctop, cw / 2, 4, 0, 0, Math.PI * 2); ctx.fill();

  // Wick
  ctx.save();
  ctx.strokeStyle = '#150a04'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, ctop);
  ctx.quadraticCurveTo(cx + sway * 0.18, ctop - 6, cx + sway * 0.38, wy);
  ctx.stroke();
  ctx.restore();

  // Flame 1: outer radial glow
  let f1a = 0.15 + sg * 0.06 + sp * 0.04;
  g = ctx.createRadialGradient(tx, by - fh * 0.35, 0, tx, by - fh * 0.35, fh * 1.3);
  g.addColorStop(0, `rgba(255,142,12,${f1a})`);
  g.addColorStop(0.5, `rgba(255,72,0,${f1a * 0.26})`);
  g.addColorStop(1, 'rgba(255,28,0,0)');
  ctx.fillStyle = g;
  flamePath(ctx, tx, bx, by, fw * 1.65, fh * 1.28); ctx.fill();

  // Flame 2: outer body (orange-red)
  g = ctx.createLinearGradient(0, by, 0, by - fh);
  g.addColorStop(0, 'rgba(255,72,0,0.92)');
  g.addColorStop(0.55, 'rgba(238,40,0,0.70)');
  g.addColorStop(1, 'rgba(198,10,0,0)');
  ctx.fillStyle = g;
  flamePath(ctx, tx, bx, by, fw, fh); ctx.fill();

  // Flame 3: middle (yellow-orange)
  let m3a = 0.95 + sg * 0.05;
  g = ctx.createLinearGradient(0, by, 0, by - fh * 0.88);
  g.addColorStop(0, `rgba(255,196,22,${m3a})`);
  g.addColorStop(0.38, `rgba(255,152,0,${m3a * 0.82})`);
  g.addColorStop(0.78, `rgba(255,88,0,${m3a * 0.44})`);
  g.addColorStop(1, 'rgba(255,48,0,0)');
  ctx.fillStyle = g;
  flamePath(ctx, tx + sway * 0.02, bx + sway * 0.06, by, fw * 0.62, fh * 0.88); ctx.fill();

  // Flame 4: inner bright (yellow-white)
  g = ctx.createLinearGradient(0, by, 0, by - fh * 0.70);
  g.addColorStop(0, 'rgba(255,255,205,1.0)');
  g.addColorStop(0.28, 'rgba(255,232,108,0.98)');
  g.addColorStop(0.65, 'rgba(255,168,28,0.70)');
  g.addColorStop(1, 'rgba(255,108,0,0)');
  ctx.fillStyle = g;
  flamePath(ctx, tx + sway * 0.01, bx + sway * 0.03, by, fw * 0.35, fh * 0.70); ctx.fill();

  // Flame 5: core (white-blue ellipse at wick base)
  let cxa = cx + sway * 0.04, cya = by - 5;
  let c5a = 0.85 + sg * 0.15;
  g = ctx.createRadialGradient(cxa, cya, 0, cxa, cya, 9);
  g.addColorStop(0, `rgba(255,255,255,${c5a})`);
  g.addColorStop(0.42, `rgba(212,230,255,${c5a * 0.62})`);
  g.addColorStop(1, 'rgba(172,202,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(cxa, cya, 4.5, 6.5, 0, 0, Math.PI * 2); ctx.fill();

  requestAnimationFrame(ts => draw(ts / 1000));
}

requestAnimationFrame(ts => draw(ts / 1000));
</script>
</body>
</html>
