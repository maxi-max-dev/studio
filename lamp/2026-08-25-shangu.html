<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>山谷</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #040408;
  width: 100vw; height: 100vh;
  overflow: hidden;
  cursor: pointer;
  user-select: none;
}
canvas { display: block; }
#hint {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.09);
  font: 13px Georgia, serif;
  letter-spacing: 0.1em;
  transition: opacity 2s;
  pointer-events: none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">点击开始</div>
<script>
const cv   = document.getElementById('c');
const cx   = cv.getContext('2d');
const hint = document.getElementById('hint');

let W, H;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
resize();
addEventListener('resize', resize);

// ── Config ─────────────────────────────────────────────
const FMIN = 150, FMAX = 460;
const DELAYS = [0, 3200, 12000, 30000];        // ms delay per voice
const VOLS   = [0.30, 0.17, 0.09, 0.044];
const CUTOFF = [9000, 1700, 620, 230];          // lowpass Hz (softer with distance)
const COLORS = ['#c89050','#6aafc2','#3d7292','#224e66'];
const RADII  = [7, 5.5, 4, 3];
const ALPHAS = [1.0, 0.58, 0.30, 0.13];
const XF     = [0.27, 0.43, 0.59, 0.75];       // x-fraction per voice
const PANS   = [0.0, 0.22, 0.42, 0.62];        // stereo pan (R)
const REC    = 100;                             // history interval ms
const HIST_N = Math.ceil(35000 / REC) + 10;

// ── State ──────────────────────────────────────────────
let ac = null, started = false;
let oscs = [], gains = [], filtrs = [];

let aFrom = 220, aTo = 220, aTStart = 0, aTEnd = 0;

const hist = [];                                // [{t, f}] — A's frequency history
const dF   = [220, 220, 220, 220];             // visual display freq (smoothed)

// ── Helpers ────────────────────────────────────────────
const rnd   = (a, b) => a + Math.random() * (b - a);
const randF = ()     => rnd(FMIN, FMAX);
const randD = ()     => rnd(7000, 17000);

function curA(now) {
  if (now >= aTEnd) return aTo;
  return aFrom + (aTo - aFrom) * (now - aTStart) / (aTEnd - aTStart);
}

function histAt(delayMs) {
  if (!hist.length) return dF[0];
  const tgt = performance.now() - delayMs;
  if (hist[0].t >= tgt) return hist[0].f;
  for (let i = hist.length - 1; i >= 0; i--) {
    if (hist[i].t <= tgt) return hist[i].f;
  }
  return hist[0].f;
}

function newMove(now) {
  aFrom   = aTo;
  aTo     = randF();
  aTStart = now;
  aTEnd   = now + randD();
  const dur = (aTEnd - aTStart) / 1000;
  oscs[0].frequency.cancelScheduledValues(ac.currentTime);
  oscs[0].frequency.setValueAtTime(aFrom, ac.currentTime);
  oscs[0].frequency.linearRampToValueAtTime(aTo, ac.currentTime + dur);
}

// ── Audio init ─────────────────────────────────────────
function start() {
  if (started) return;
  started = true;
  hint.style.opacity = '0';

  ac = new (window.AudioContext || window.webkitAudioContext)();

  for (let i = 0; i < 4; i++) {
    const osc  = ac.createOscillator();
    const filt = ac.createBiquadFilter();
    const pan  = ac.createStereoPanner ? ac.createStereoPanner() : null;
    const gain = ac.createGain();

    osc.type = 'sine';
    filt.type = 'lowpass';
    filt.frequency.value = CUTOFF[i];
    if (pan) pan.pan.value = PANS[i];
    gain.gain.value = 0;

    let node = osc;
    node.connect(filt); node = filt;
    if (pan) { node.connect(pan); node = pan; }
    node.connect(gain);
    gain.connect(ac.destination);
    osc.start();

    oscs.push(osc); filtrs.push(filt); gains.push(gain);
  }

  // Init A at a stable frequency
  const initF = randF();
  aFrom = aTo = initF;
  oscs[0].frequency.value = initF;
  dF[0] = initF;
  aTEnd = performance.now(); // triggers newMove on first frame

  // Fade A in
  gains[0].gain.linearRampToValueAtTime(VOLS[0], ac.currentTime + 1.8);

  // Delayed fade-ins for echoes
  for (let i = 1; i < 4; i++) {
    setTimeout(() => {
      if (!ac) return;
      gains[i].gain.linearRampToValueAtTime(VOLS[i], ac.currentTime + 2.2);
    }, DELAYS[i] + 600);
  }

  // Record history + schedule echo oscillators
  setInterval(() => {
    const t2 = performance.now();
    const f  = curA(t2);
    hist.push({ t: t2, f });
    if (hist.length > HIST_N) hist.shift();

    const at = ac.currentTime;
    for (let i = 1; i < 4; i++) {
      const hf = histAt(DELAYS[i]);
      oscs[i].frequency.cancelScheduledValues(at);
      oscs[i].frequency.setValueAtTime(oscs[i].frequency.value, at);
      oscs[i].frequency.linearRampToValueAtTime(hf, at + 0.13);
    }
  }, REC);

  requestAnimationFrame(loop);
}

// ── Visual ─────────────────────────────────────────────
function fy(f) {
  return H * 0.12 + H * 0.76 * (1 - (f - FMIN) / (FMAX - FMIN));
}

function mkRgba(hex, a) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function loop(ts) {
  requestAnimationFrame(loop);
  if (!started) return;

  const now = performance.now();
  if (now >= aTEnd) newMove(now);

  // Update display freqs
  dF[0] = curA(now);
  for (let i = 1; i < 4; i++) {
    dF[i] += (histAt(DELAYS[i]) - dF[i]) * 0.016;
  }

  cx.clearRect(0, 0, W, H);

  // Faint inscription — barely there, for the patient eye
  cx.fillStyle = 'rgba(255,252,245,0.038)';
  cx.font = '10px Georgia';
  cx.textAlign = 'right';
  cx.fillText('三十秒后，你还在吗', W - 18, H - 18);
  cx.textAlign = 'left';

  // Lines between adjacent voices when frequency-close (beat visualization)
  for (let i = 0; i < 3; i++) {
    const d = Math.abs(dF[i] - dF[i + 1]);
    if (d < 28) {
      const strength = (28 - d) / 28;
      const x1 = W * XF[i],     y1 = fy(dF[i]);
      const x2 = W * XF[i + 1], y2 = fy(dF[i + 1]);
      const pulse = d > 0.4
        ? Math.max(0, 0.3 + 0.7 * Math.sin(ts * 0.001 * d * Math.PI * 2))
        : 1;
      cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x2, y2);
      cx.strokeStyle = `rgba(155,195,215,${strength * 0.22 * pulse})`;
      cx.lineWidth = 1;
      cx.stroke();
    }
  }

  // Dots (draw back to front: i=3 first so A is on top)
  for (let i = 3; i >= 0; i--) {
    const x   = W * XF[i];
    const y   = fy(dF[i]);
    const r   = RADII[i];
    const a   = ALPHAS[i];
    const col = COLORS[i];

    // Soft glow halo
    const grd = cx.createRadialGradient(x, y, 0, x, y, r * 5.5);
    grd.addColorStop(0, mkRgba(col, a * 0.20));
    grd.addColorStop(1, 'transparent');
    cx.beginPath(); cx.arc(x, y, r * 5.5, 0, Math.PI * 2);
    cx.fillStyle = grd; cx.fill();

    // Core dot
    cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2);
    cx.fillStyle = mkRgba(col, a);
    cx.fill();
  }

  // Tiny Δ label when an echo is within 8 Hz of A
  for (let i = 1; i < 4; i++) {
    const d = Math.abs(dF[0] - dF[i]);
    if (d < 8) {
      cx.fillStyle = 'rgba(255,255,255,0.06)';
      cx.font = '9px Georgia';
      cx.fillText(`Δ${d.toFixed(1)}`, W * XF[i] + 11, fy(dF[i]) - 9);
    }
  }
}

loop(0);
document.addEventListener('click', start);
</script>
</body>
</html>
