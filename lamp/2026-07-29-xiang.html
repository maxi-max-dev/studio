<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>响</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #06090a; overflow: hidden; cursor: crosshair; }
canvas { display: block; }
#label {
  position: fixed;
  bottom: 22px;
  right: 28px;
  font-family: 'Songti SC', 'SimSun', 'Georgia', serif;
  font-size: 15px;
  letter-spacing: 0.3em;
  color: rgba(212, 192, 152, 0.18);
  pointer-events: none;
  user-select: none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label">响</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H;
const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
resize();
addEventListener('resize', resize);

// Ripple object: {x, y, gen, radius, born, maxR, dur, maxOp, sw, spawnAt, kids, didSpawn}
const ripples = [];

// Generation config — each level is fainter, smaller, shorter-lived
const GEN = [
  { maxR: 130, dur: 2600, maxOp: 0.70, sw: 1.4, spawnAt: 55, kids: 3 },
  { maxR:  72, dur: 1900, maxOp: 0.35, sw: 0.9, spawnAt: 28, kids: 2 },
  { maxR:  40, dur: 1250, maxOp: 0.17, sw: 0.55, spawnAt: null, kids: 0 },
  { maxR:  19, dur:  720, maxOp: 0.065, sw: 0.3, spawnAt: null, kids: 0 },
];

function spawn(x, y, gen) {
  if (gen >= GEN.length || ripples.length > 240) return;
  const g = GEN[gen];
  ripples.push({
    x, y, gen,
    radius: 0,
    born: performance.now(),
    maxR: g.maxR, dur: g.dur, maxOp: g.maxOp, sw: g.sw,
    spawnAt: g.spawnAt, kids: g.kids,
    didSpawn: false,
  });
}

cv.addEventListener('click', e => spawn(e.clientX, e.clientY, 0));
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.touches) spawn(t.clientX, t.clientY, 0);
}, { passive: false });

// Ease-out quad: fast start, slow end
const ease = t => 1 - (1 - t) * (1 - t);

function loop(now) {
  ctx.clearRect(0, 0, W, H);

  // Ambient: a slow breathing circle at center, very faint
  // It was already here before your first click.
  const bt = now * 0.00031;
  const ambR = 182 + Math.sin(bt) * 24;
  const ambOp = Math.max(0.004, 0.014 + Math.sin(bt * 0.57) * 0.006);
  ctx.beginPath();
  ctx.arc(W / 2, H / 2, ambR, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(208, 186, 144, ${ambOp})`;
  ctx.lineWidth = 0.4;
  ctx.stroke();

  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    const t = Math.min((now - r.born) / r.dur, 1);
    r.radius = ease(t) * r.maxR;

    // Opacity: quick rise to peak, then long slow fade
    const op = t < 0.07
      ? r.maxOp * (t / 0.07)
      : r.maxOp * (1 - (t - 0.07) / 0.93);

    // Spawn children when radius crosses threshold
    if (!r.didSpawn && r.spawnAt && r.radius >= r.spawnAt) {
      r.didSpawn = true;
      const baseAngle = Math.random() * Math.PI * 2;
      for (let k = 0; k < r.kids; k++) {
        const angle = baseAngle + (Math.PI * 2 * k / r.kids) + (Math.random() - 0.5) * 0.65;
        const dist = 6 + Math.random() * 10;
        spawn(
          r.x + Math.cos(angle) * dist,
          r.y + Math.sin(angle) * dist,
          r.gen + 1
        );
      }
      // Ghost echo: gen-1 ripples have a 30% chance to leave a ghost gen-3
      // at their position — nearly invisible, very brief
      if (r.gen === 1 && Math.random() < 0.30) {
        spawn(r.x, r.y, 3);
      }
    }

    if (t >= 1) { ripples.splice(i, 1); continue; }

    ctx.beginPath();
    ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(215, 194, 153, ${Math.max(0, op)})`;
    ctx.lineWidth = r.sw;
    ctx.stroke();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
